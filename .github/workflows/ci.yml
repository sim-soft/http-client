name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer.json declares php ^8.2, so every supported minor is exercised.
        php: ['8.2', '8.3', '8.4']
        dependencies: [highest]
        include:
          # Guards the lower bounds of the declared PSR constraints.
          - php: '8.2'
            dependencies: lowest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
          ini-values: error_reporting=E_ALL

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run tests
        run: vendor/bin/phpunit --use-baseline baseline.xml tests

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # PCOV rather than Xdebug: it only records line coverage, which is all
      # this job gates on, and it does so without Xdebug's slowdown on a suite
      # that makes real network calls.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, pcov
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      # Coverage is measured over src only; phpunit.xml already scopes <source>
      # to that directory, so tests and fixtures do not inflate the figure.
      - name: Run tests with coverage
        run: |
          vendor/bin/phpunit --use-baseline baseline.xml tests \
            --coverage-clover=coverage.xml \
            --coverage-text \
            --only-summary-for-coverage-text \
            | tee coverage.txt

      # Blocking. The threshold tracks the measured figure rather than an
      # aspiration: it exists to catch a drop, not to demand an increase.
      # Raise it when real coverage rises; never lower it to make a red build
      # green.
      - name: Check coverage threshold
        env:
          MINIMUM: '80'
        run: |
          COVERED=$(php -r '$x = simplexml_load_file("coverage.xml"); echo (int) $x->project->metrics["coveredstatements"];')
          TOTAL=$(php -r '$x = simplexml_load_file("coverage.xml"); echo (int) $x->project->metrics["statements"];')

          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::No statements were measured — the coverage driver did not load."
            exit 1
          fi

          PERCENT=$(php -r "printf('%.2f', $COVERED / $TOTAL * 100);")
          echo "Line coverage: ${PERCENT}% (${COVERED}/${TOTAL} statements)"

          {
            echo "### Code coverage"
            echo ""
            echo "**${PERCENT}%** of lines — ${COVERED} of ${TOTAL} statements."
            echo ""
            echo '```'
            sed -n '/Code Coverage Report/,$p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$(php -r "echo $PERCENT < ${MINIMUM} ? 1 : 0;")" -eq 1 ]; then
            echo "::error::Line coverage ${PERCENT}% is below the ${MINIMUM}% minimum."
            exit 1
          fi

      # Retained so a drop can be diffed against an earlier run rather than
      # only seen as a threshold failure.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: coverage.xml
          retention-days: 14

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: PHPMD
        run: vendor/bin/phpmd src github phpmd.xml

  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      # Blocking. Configuration lives in phpcs.xml, which applies PSR-12 to
      # src and tests and exempts test fixtures from the one-class-per-file
      # rule.
      - name: PHPCS
        run: vendor/bin/phpcs --report=full

  composer-validate:
    name: Validate composer.json
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # composer.lock is gitignored for a library, so lock freshness is not
      # checked here — only the manifest itself.
      - name: Validate
        run: composer validate --strict --no-check-lock
