    <!-- Theme -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css"
          title="docsify-darklight-theme" type="text/css">
    <style>
        .logo-text {
            color: inherit !important;
        }

        /* Version badge under the sidebar title. Hidden until the fetch
           resolves, so a Packagist outage leaves no empty gap. */
        .app-version {
            display: none;
            margin: -12px 0 18px;
            text-align: center;
        }

        .app-version.is-loaded {
            display: block;
        }

        .app-version a {
            /* currentColor, not a fixed grey: the darklight theme swaps the
               text colour per theme, and a literal light border would glare
               against the dark background. */
            border: 1px solid currentColor;
            border-radius: 3px;
            color: inherit;
            font-size: 12px;
            opacity: 0.55;
            padding: 1px 8px;
            text-decoration: none;
        }

        .app-version a:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
<div id="app"></div>
<script>
    window.$docsify = {
        name: 'Simsoft HttpClient',
        nameLink: 'https://sim-soft.github.io/http-client/',
        repo: 'https://github.com/sim-soft/http-client',
        loadSidebar: true,
        subMaxLevel: 0,
        auto2top: true,
        search: {
            placeholder: 'Search documentation',
            noData: 'No results found',
            depth: 3
        },
        darklightTheme: {
            defaultTheme: 'light',
            siteFont: 'Source Sans Pro, Helvetica Neue, Arial, sans-serif',
            codeFontFamily: 'JetBrains Mono, Roboto Mono, Monaco, courier, monospace',
            dark: {
                accent: '#E8960C',
                toogleBackground: '#1a1a2e',
                background: '#1a1a2e',
                textColor: '#e0e0e0',
                codeBackgroundColor: '#0d1117'
            },
            light: {
                accent: '#C47A08',
                toogleBackground: '#fff',
                background: '#fff',
                textColor: '#1a1a1a',
                codeBackgroundColor: '#f6f8fa'
            }
        }
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-php.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
<script>
    window.$docsify.plugins = (window.$docsify.plugins || []).concat(function (hook) {
        hook.doneEach(function () {
            var title = document.querySelector('.markdown-section h1');
            document.title = 'Simsoft HttpClient' + (title ? ' - ' + title.textContent : '');
        });
    });

    // Show the latest released version beneath the sidebar title.
    //
    // Read at runtime rather than hard-coded, so the site cannot drift out of
    // date the way a literal would every time a release is tagged.
    //
    // The source is the GitHub releases API, not Packagist: repo.packagist.org
    // sends no Access-Control-Allow-Origin header, so a browser fetch of it
    // from this origin is blocked outright. GitHub sends `*`, and it is also
    // the resource the badge links to, so the number and its destination
    // cannot disagree.
    //
    // The element is only revealed once a version actually comes back. A
    // failed, rate-limited (60/hr unauthenticated) or blocked request leaves
    // the sidebar exactly as it was.
    window.$docsify.plugins = window.$docsify.plugins.concat(function (hook) {
        hook.mounted(function () {
            var name = document.querySelector('.sidebar .app-name');
            if (!name) {
                return;
            }

            var el = document.createElement('div');
            el.className = 'app-version';
            name.insertAdjacentElement('afterend', el);

            fetch('https://api.github.com/repos/sim-soft/http-client/releases/latest')
                .then(function (r) {
                    return r.ok ? r.json() : Promise.reject(r.status);
                })
                .then(function (release) {
                    var tag = release && release.tag_name;
                    if (!tag || !/^v?\d+\.\d+\.\d+/.test(tag)) {
                        return;
                    }

                    var link = document.createElement('a');
                    link.href = release.html_url;
                    link.target = '_blank';
                    link.rel = 'noopener';
                    link.textContent = 'v' + tag.replace(/^v/, '');
                    el.appendChild(link);
                    el.classList.add('is-loaded');
                })
                .catch(function () {
                    /* Offline, rate-limited or blocked: show nothing. */
                });
        });
    });
</script>
</body>
</html>
